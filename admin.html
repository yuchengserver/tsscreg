<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TSSC13TH - 管理員後台</title>
  <link rel="icon" type="image/png" href="tsscblack.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="admin.css">
  
  <!-- 引入 Google Identity Services SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  
  <header class="navbar">
    <a href="index.html" class="nav-brand">
      <img src="tpshcmcsc.png" alt="TSSC Logo" class="nav-logo">
      <span>TSSC13TH 活動報名專區</span>

    <div class="nav-menu">
      <a href="index.html" class="nav-btn">首頁與通知</a>
      <a href="admin.html" class="nav-btn admin-link active">⚙️ 管理員後台</a>
    </div>
  </header>

  
  <div id="loginSection" class="login-card-wrapper" style="margin-top: 60px;">
    <div class="login-card">
      <h2>管理者身分驗證</h2>
      <p class="login-subtitle">後台僅限授權管理員帳號登入</p>
      
       <div class="login-form">
         <div id="loginPromptBox">
           <button type="button" id="customGoogleBtn" class="btn-google-custom">
             <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.63-.06-1.25-.16-1.84H9v3.49h4.84c-.21 1.12-.86 2.07-1.83 2.71v2.26h2.97c1.74-1.6 2.66-3.95 2.66-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.97-2.26c-.81.54-1.84.86-2.99.86-2.31 0-4.27-1.56-4.97-3.66H1.02v2.33C2.53 15.93 5.51 18 9 18z"/><path fill="#FBBC05" d="M4.03 10.76c-.18-.54-.28-1.13-.28-1.76s.1-1.22.28-1.76V4.91H1.02C.37 6.22 0 7.7 0 9.29s.37 3.07 1.02 4.38l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.51 0 2.53 2.07 1.02 4.91l3.01 2.33c.7-2.1 2.66-3.66 4.97-3.66z"/></svg>
             使用 Google 帳號登入
          </button>
         </div>
        <input type="hidden" id="adminCredential">
      </div>

      <div id="loginMsg" class="message error" style="display:none; margin-top:15px;"></div>
      <div class="login-footer">
      胡志明市臺灣學校學生會 TSSC13TH © 2026 yucheng
    </div>
    </div>
 </div>
    
    

  


  <div id="adminContent" class="container wide" style="display:none; margin-top: 30px;">
    
    <div class="admin-top-bar">
      <div>
        <h2 style="margin: 0; font-size: 22px; color: #1f2328;">TSSC13TH 後台管理系統</h2>
        <p style="margin: 4px 0 0 0; font-size: 13px; color: #57606a;">胡志明市臺灣學校學生會 - 發布新活動與報名管理</p>
      </div>
      <button onclick="logout()" class="btn-secondary" style="background-color: #ffeef0; color: #cf222e; border-color: #ffc1c0; width:auto; padding: 8px 16px;"> 登出</button>
    </div>

  
    <div class="admin-tabs">
      <button id="tabCreateBtn" class="admin-tab-btn active" onclick="switchTab('create')">➕ 建立 / 編輯活動</button>
      <button id="tabListBtn" class="admin-tab-btn" onclick="switchTab('list')">📋 報名者資料查詢</button>
    </div>

    
    <div id="createSection" class="admin-section">
      <div class="section-badge-header">
        <span class="section-tag create-tag">➕ 建立活動與自訂表單題目</span>
      </div>

      <div id="createEventForm">
        <div class="form-row">
          <div class="form-group half">
            <label for="newEventId">活動 ID *</label>
            <input type="text" id="newEventId" class="form-control" placeholder="例如：ACT001">
          </div>
          <div class="form-group half">
            <label for="newEventName">活動名稱 *</label>
            <input type="text" id="newEventName" class="form-control" placeholder="例如：電競比賽">
          </div>
        </div>

        <div class="form-group">
          <label for="newEventDesc">活動說明</label>
          <textarea id="newEventDesc" class="form-control" rows="3" placeholder="活動詳細內容說明..."></textarea>
        </div>

        <div class="form-row">
          <div class="form-group half">
            <label for="newStartTime">開始報名時間 *</label>
            <input type="datetime-local" id="newStartTime" class="form-control">
          </div>
          <div class="form-group half">
            <label for="newEndTime">結束報名時間 *</label>
            <input type="datetime-local" id="newEndTime" class="form-control">
          </div>
        </div>

        <hr style="margin: 25px 0; border: 0; border-top: 1px solid #d0d7de;">

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
          <h3 style="margin: 0; font-size: 18px;">📝 自訂報名表單題目</h3>
          <div style="display: flex; gap: 10px;">
            <button type="button" onclick="previewForm()" class="btn-secondary" style="width: auto; padding: 6px 14px; background-color: #ddf4ff; color: #0969da; border-color: #b6e3ff;">👁️ 預覽表單長相</button>
            <button type="button" onclick="addQuestionBuilder()" class="btn-secondary" style="width: auto; padding: 6px 12px;">➕ 新增題目</button>
          </div>
        </div>

        <div id="questionsContainer">
          
        </div>

        <button type="button" class="btn-submit" id="createBtn" onclick="submitCreateEvent()" style="margin-top: 20px;">送出建立 / 更新活動</button>
      </div>
      <div id="createMsg" class="message" style="display:none; margin-top: 15px;"></div>

    </div>
    
    
    
    <div id="listSection" class="admin-section" style="display: none;">
      <div class="admin-header-flex">
        <span class="section-tag list-tag">📋 已報名者資料列表</span>
        <button onclick="fetchRegistrations()" class="btn-refresh">🔄 重新整理資料</button>
      </div>

      <div class="form-row" style="margin-top: 15px;">
        <div class="form-group half">
          <label>選擇要查看的活動</label>
          <select id="selectEvent" class="form-control" onchange="fetchRegistrations()">
            <option value="">請先選擇活動...</option>
          </select>
        </div>
        <div class="form-group half">
          <label for="searchEmailInput">🔍 搜尋 Email 或關鍵字</label>
          <!-- 移除 disabled，讓搜尋框隨時可以打字 -->
          <input type="text" id="searchEmailInput" class="form-control" placeholder="輸入 Email / 學號 / 關鍵字過濾..." oninput="filterRegistrations()">
        </div>
      </div>

      <div id="regLoading" class="message" style="display: none;">載入報名資料中...</div>

      <div class="table-responsive" style="margin-top: 15px;">
        <table id="dataTable">
          <thead>
            <tr id="tableHeaderRow">
              <th>報名時間</th>
              <th>Email</th>
            </tr>
          </thead>
          <tbody>
            <tr><td colspan="2" class="no-data">請先選擇上方活動以檢視報名清單。</td></tr>
          </tbody>
        </table>
      </div>
    </div>
    <div class="login-footer">
      胡志明市臺灣學校學生會 TSSC13TH © 2026 yucheng
    </div>
  </div>

  <!-- 預覽表單 Modal -->
  <div id="previewModal" class="modal-overlay">
    <div class="modal-content">
      <button type="button" class="modal-close" onclick="closePreviewModal()">✕</button>
      <h2 id="previewTitle" style="margin-top: 0; color: #1f2328;">活動名稱預覽</h2>
      <p id="previewDesc" style="color: #57606a; margin-bottom: 20px; font-size: 14px;"></p>
      <hr style="border: 0; border-top: 1px solid #d0d7de; margin-bottom: 20px;">
      <div id="previewQuestionsContainer"></div>
      <div style="margin-top: 30px; text-align: right;">
        <button type="button" class="btn-secondary" onclick="closePreviewModal()" style="width: auto; padding: 8px 20px;">關閉預覽</button>
      </div>
    </div>
  </div>

    

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzw8vASm3Nm7eIpcQYQ_QBMK4m3j0d9Thcw8N8nWBsuUPJDCsioB_KLErcH1nIP2v0/exec";
    const TARGET_SHEET_ID = "18fxfF-BnNlDnhCH0NORbNeWXKSo1KHmljfPCkpvJTKo"; // 🔒 指定專用上鎖試算表 ID
    const GOOGLE_CLIENT_ID = "434067788519-ivv0ms7qobv7s5s7an8go152v8adc64l.apps.googleusercontent.com";
    
    // 授權的管理員清單
    const ALLOWED_ADMINS = [
      "yucheng.server@gmail.com",
      "1141303@tshcmc.edu.vn",
      "tssc13th@gmail.com"
    ];

    let currentCredential = "";
    let rawRegistrationsData = []; // 儲存該活動所有原始資料
    let googleTokenClient = null;

    window.onload = function() {
      if (typeof google !== 'undefined') {
        googleTokenClient = google.accounts.oauth2.initTokenClient({
          client_id: GOOGLE_CLIENT_ID,
          scope: 'email profile openid',
          callback: (response) => {
            if (response.access_token) {
              loginAdminWithGoogle(response.access_token);
            }
          },
        });

        document.getElementById("customGoogleBtn").addEventListener("click", () => {
          googleTokenClient.requestAccessToken();
        });
      }
    };

    function loginAdminWithGoogle(accessToken) {
      const loginMsg = document.getElementById("loginMsg");
      loginMsg.style.display = "none";

      // 取得 Google 用戶資料
      fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
        headers: { 'Authorization': `Bearer ${accessToken}` }
      })
      .then(res => res.json())
      .then(userInfo => {
        const email = userInfo.email ? userInfo.email.toLowerCase() : "";

        // 前端驗證是否在授權清單中
        if (!ALLOWED_ADMINS.includes(email)) {
          loginMsg.textContent = `❌ 權限不足：帳號 ${email} 無權存取管理員後台！`;
          loginMsg.style.display = "block";
          return;
        }

        currentCredential = accessToken;
        document.getElementById("loginSection").style.display = "none";
        document.getElementById("adminContent").style.display = "block";
        switchTab('create');
        
        if (document.getElementById("questionsContainer").children.length === 0) {
          addQuestionBuilder("姓名", "text", true);
          addQuestionBuilder("班級", "text", true);
          addQuestionBuilder("座號", "text", true);
        }
      })
      .catch(err => {
        console.error(err);
        loginMsg.textContent = "Google 登入驗證失敗，請重試！";
        loginMsg.style.display = "block";
      });
    }

    function switchTab(tabName) {
      const createSec = document.getElementById("createSection");
      const listSec = document.getElementById("listSection");
      const tabCreateBtn = document.getElementById("tabCreateBtn");
      const tabListBtn = document.getElementById("tabListBtn");

      if (tabName === 'create') {
        createSec.style.display = "block";
        listSec.style.display = "none";
        tabCreateBtn.className = "admin-tab-btn active";
        tabListBtn.className = "admin-tab-btn";
      } else {
        createSec.style.display = "none";
        listSec.style.display = "block";
        tabCreateBtn.className = "admin-tab-btn";
        tabListBtn.className = "admin-tab-btn active";
        loadAdminEvents();
      }
    }

    function addQuestionBuilder(label = "", type = "text", required = true, options = [], imageUrl = "", minSelect = 0, maxSelect = 0) {
      const container = document.getElementById("questionsContainer");
      const div = document.createElement("div");
      div.className = "question-builder-card";
      
      let optionsHtml = '';
      if (['radio', 'checkbox', 'select'].includes(type)) {
        if (!options || options.length === 0) options = [{ text: "選項 1", isOther: false }];
        options.forEach(opt => {
          const optObj = typeof opt === 'string' ? { text: opt, isOther: false } : opt;
          optionsHtml += `
            <div class="option-item-row">
              <input type="text" class="form-control option-input" value="${optObj.text}" placeholder="輸入選項內容">
              <label style="font-size: 13px; font-weight: normal; display: flex; align-items: center; gap: 4px; white-space: nowrap; cursor: pointer;">
                <input type="checkbox" class="option-is-other" ${optObj.isOther ? 'checked' : ''}> 設為「其他」
              </label>
              <button type="button" class="btn-delete-option" onclick="this.parentElement.remove()" title="刪除選項">✕</button>
            </div>
          `;
        });
      }

      div.innerHTML = `
        <button type="button" class="btn-delete-q" onclick="this.parentElement.remove()">刪除此題</button>
        <div class="form-row">
          <div class="form-group half">
            <label>題目名稱 *</label>
            <input type="text" class="form-control q-label" value="${label}" placeholder="例如：姓名、班級、座號...">
          </div>
          <div class="form-group half">
            <label>題目類型 *</label>
            <select class="form-control q-type" onchange="toggleOptionsInput(this)">
              <option value="text" ${type === 'text' ? 'selected' : ''}>簡答 / 文字</option>
              <option value="textarea" ${type === 'textarea' ? 'selected' : ''}>長文字說明</option>
              <option value="radio" ${type === 'radio' ? 'selected' : ''}>單選題</option>
              <option value="checkbox" ${type === 'checkbox' ? 'selected' : ''}>多選題</option>
              <option value="select" ${type === 'select' ? 'selected' : ''}>下拉選單</option>
            </select>
          </div>
        </div>

        <!-- 圖片上傳區塊 -->
        <div class="form-group" style="margin-top: 12px;">
          <label>題目附加圖片（選填）</label>
          <div style="display: flex; gap: 10px; align-items: center;">
            <input type="file" accept="image/*" class="form-control q-image-file" onchange="handleImageUpload(this)" style="padding: 6px;">
            <button type="button" class="btn-secondary" onclick="clearQuestionImage(this)" style="width: auto; padding: 6px 10px; font-size: 13px; background-color: #ffeef0; color: #cf222e; border-color: #ffc1c0;">移除圖片</button>
          </div>
          <input type="hidden" class="q-image-url" value="${imageUrl || ''}">
          <div class="image-preview-box" style="margin-top: 8px; display: ${imageUrl ? 'block' : 'none'};">
            <img src="${imageUrl || ''}" class="preview-img q-img-tag">
          </div>
        </div>

        <!-- 多選題限制選取數量設定 (僅多選題顯示) -->
        <div class="checkbox-limit-box" style="margin-top: 12px; display: ${type === 'checkbox' ? 'block' : 'none'}; background: #eef5ff; padding: 10px 12px; border-radius: 6px; border: 1px solid #b6e3ff;">
          <label style="font-size: 13px; font-weight: 600; color: #0969da; display: block; margin-bottom: 6px;">⚙️ 多選題選取數量限制 (選填)</label>
          <div style="display: flex; gap: 15px; align-items: center;">
            <div>
              <span style="font-size: 12px;">最少選：</span>
              <input type="number" class="form-control q-min-select" value="${minSelect || 0}" min="0" style="width: 70px; display: inline-block; padding: 4px 8px;">
            </div>
            <div>
              <span style="font-size: 12px;">最多選：</span>
              <input type="number" class="form-control q-max-select" value="${maxSelect || 0}" min="0" style="width: 70px; display: inline-block; padding: 4px 8px;">
            </div>
            <small style="color: #57606a; font-size: 11px;">(設為 0 代表不限制。例如 3 選 2 請將最少與最多皆設為 2)</small>
          </div>
        </div>

        <div class="options-container options-box" style="display: ${['radio','checkbox','select'].includes(type) ? 'block' : 'none'};">
          <label style="margin-bottom: 8px; display: block; font-weight: 600;">選項設定</label>
          <div class="options-list">
            ${optionsHtml}
          </div>
          <button type="button" class="btn-secondary" onclick="addOptionItem(this)" style="margin-top: 8px; width: auto; padding: 4px 10px; font-size: 13px;">➕ 新增選項</button>
        </div>
        <div style="margin-top: 15px;">
          <label><input type="checkbox" class="q-required" ${required ? 'checked' : ''}> 此題設為必填</label>
        </div>
      `;
      container.appendChild(div);
    }

    function handleImageUpload(inputEl) {
      const file = inputEl.files[0];
      if (!file) return;

      if (file.size > 1024 * 1024 * 2) {
        alert("圖片檔案過大！請上傳小於 2MB 的圖片。");
        inputEl.value = "";
        return;
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        const base64Str = e.target.result;
        const card = inputEl.closest('.question-builder-card');
        card.querySelector('.q-image-url').value = base64Str;
        const imgTag = card.querySelector('.q-img-tag');
        imgTag.src = base64Str;
        card.querySelector('.image-preview-box').style.display = 'block';
      };
      reader.readAsDataURL(file);
    }

    function clearQuestionImage(btnEl) {
      const card = btnEl.closest('.question-builder-card');
      card.querySelector('.q-image-file').value = "";
      card.querySelector('.q-image-url').value = "";
      card.querySelector('.q-img-tag').src = "";
      card.querySelector('.image-preview-box').style.display = 'none';
    }

    function toggleOptionsInput(selectEl) {
      const card = selectEl.closest('.question-builder-card');
      const optContainer = card.querySelector('.options-container');
      const optionsList = card.querySelector('.options-list');
      const limitBox = card.querySelector('.checkbox-limit-box');
      const val = selectEl.value;

      if (val === 'checkbox') {
        limitBox.style.display = 'block';
      } else {
        limitBox.style.display = 'none';
      }

      if (['radio', 'checkbox', 'select'].includes(val)) {
        optContainer.style.display = 'block';
        if (optionsList.children.length === 0) {
          addOptionItem(selectEl);
        }
      } else {
        optContainer.style.display = 'none';
      }
    }

    function addOptionItem(el) {
      const card = el.closest('.question-builder-card');
      const optionsList = card.querySelector('.options-list');
      const optCount = optionsList.children.length + 1;
      
      const row = document.createElement("div");
      row.className = "option-item-row";
      row.innerHTML = `
        <input type="text" class="form-control option-input" value="選項 ${optCount}" placeholder="輸入選項內容">
        <label style="font-size: 13px; font-weight: normal; display: flex; align-items: center; gap: 4px; white-space: nowrap; cursor: pointer;">
          <input type="checkbox" class="option-is-other"> 設為「其他」
        </label>
        <button type="button" class="btn-delete-option" onclick="this.parentElement.remove()" title="刪除選項">✕</button>
      `;
      optionsList.appendChild(row);
    }

    // 👁️ 預覽表單功能
    function previewForm() {
      const eventName = document.getElementById("newEventName").value.trim() || "未命名活動";
      const eventDesc = document.getElementById("newEventDesc").value.trim() || "無活動說明";
      
      document.getElementById("previewTitle").textContent = eventName;
      document.getElementById("previewDesc").textContent = eventDesc;

      const container = document.getElementById("previewQuestionsContainer");
      container.innerHTML = "";

      const qCards = document.querySelectorAll(".question-builder-card");
      if (qCards.length === 0) {
        container.innerHTML = "<p style='color: #cf222e;'>尚未設定任何題目。</p>";
        document.getElementById("previewModal").style.display = "flex";
        return;
      }

      qCards.forEach((card, index) => {
        const label = card.querySelector(".q-label").value.trim() || `未命名題目 ${index + 1}`;
        const type = card.querySelector(".q-type").value;
        const required = card.querySelector(".q-required").checked;
        const imageUrl = card.querySelector(".q-image-url").value;
        const minSelect = parseInt(card.querySelector(".q-min-select")?.value || 0);
        const maxSelect = parseInt(card.querySelector(".q-max-select")?.value || 0);

        const div = document.createElement("div");
        div.className = "form-group";
        div.style.marginBottom = "25px";
        div.style.background = "#f6f8fa";
        div.style.padding = "15px";
        div.style.borderRadius = "8px";
        div.style.border = "1px solid #d0d7de";

        let limitHint = "";
        if (type === "checkbox" && (minSelect > 0 || maxSelect > 0)) {
          if (minSelect > 0 && maxSelect > 0) {
            if (minSelect === maxSelect) {
              limitHint = ` <small style="color: #0969da; font-weight: normal;">(須選 ${minSelect} 項)</small>`;
            } else {
              limitHint = ` <small style="color: #0969da; font-weight: normal;">(須選 ${minSelect} ~ ${maxSelect} 項)</small>`;
            }
          } else if (minSelect > 0) {
            limitHint = ` <small style="color: #0969da; font-weight: normal;">(至少選 ${minSelect} 項)</small>`;
          } else if (maxSelect > 0) {
            limitHint = ` <small style="color: #0969da; font-weight: normal;">(最多選 ${maxSelect} 項)</small>`;
          }
        }

        let labelHTML = `<label style="font-weight: 600; font-size: 15px;">${label} ${required ? '<span style="color:red;">*</span>' : ''}${limitHint}</label>`;
        let imgHTML = imageUrl ? `<div style="margin-top: 8px;"><img src="${imageUrl}" class="preview-img"></div>` : "";
        let inputHTML = "";

        if (type === "text") {
          inputHTML = `<input type="text" class="form-control" disabled placeholder="簡答文字輸入區">`;
        } else if (type === "textarea") {
          inputHTML = `<textarea class="form-control" rows="3" disabled placeholder="長文字說明輸入區"></textarea>`;
        } else if (type === "select") {
          let opts = `<option value="">-- 請選擇 --</option>`;
          const optRows = card.querySelectorAll(".option-item-row");
          optRows.forEach(row => {
            const text = row.querySelector(".option-input").value.trim();
            const isOther = row.querySelector(".option-is-other").checked;
            if (text || isOther) {
              if (isOther) {
                opts += `<option value="其他">其他：(可自行填寫)</option>`;
              } else {
                opts += `<option value="${text}">${text}</option>`;
              }
            }
          });
          inputHTML = `<select class="form-control" disabled>${opts}</select>`;
        } else if (type === "radio") {
          let opts = "";
          const optRows = card.querySelectorAll(".option-item-row");
          optRows.forEach(row => {
            const text = row.querySelector(".option-input").value.trim();
            const isOther = row.querySelector(".option-is-other").checked;
            if (text || isOther) {
              if (isOther) {
                opts += `<div style="margin-top: 6px; display: flex; align-items: center; gap: 8px;"><label style="font-weight: normal; display: flex; align-items: center; gap: 4px; margin: 0;"><input type="radio" disabled> 其他：</label> <input type="text" class="form-control" disabled placeholder="請自行填寫" style="flex: 1; padding: 4px 8px; font-size: 13px;"></div>`;
              } else {
                opts += `<div style="margin-top: 6px;"><label style="font-weight: normal;"><input type="radio" disabled> ${text}</label></div>`;
              }
            }
          });
          inputHTML = opts;
        } else if (type === "checkbox") {
          let opts = "";
          const optRows = card.querySelectorAll(".option-item-row");
          optRows.forEach(row => {
            const text = row.querySelector(".option-input").value.trim();
            const isOther = row.querySelector(".option-is-other").checked;
            if (text || isOther) {
              if (isOther) {
                opts += `<div style="margin-top: 6px; display: flex; align-items: center; gap: 8px;"><label style="font-weight: normal; display: flex; align-items: center; gap: 4px; margin: 0;"><input type="checkbox" disabled> 其他：</label> <input type="text" class="form-control" disabled placeholder="請自行填寫" style="flex: 1; padding: 4px 8px; font-size: 13px;"></div>`;
              } else {
                opts += `<div style="margin-top: 6px;"><label style="font-weight: normal;"><input type="checkbox" disabled> ${text}</label></div>`;
              }
            }
          });
          inputHTML = opts;
        }

        div.innerHTML = labelHTML + imgHTML + `<div style="margin-top: 10px;">${inputHTML}</div>`;
        container.appendChild(div);
      });

      document.getElementById("previewModal").style.display = "flex";
    }

    function closePreviewModal() {
      document.getElementById("previewModal").style.display = "none";
    }

    function loadAdminEvents() {
      fetch(`${GAS_URL}?action=getEvents`)
        .then(res => res.json())
        .then(res => {
          const select = document.getElementById("selectEvent");
          select.innerHTML = '<option value="">請先選擇活動...</option>';
          if (res.status === "success" && res.data) {
            res.data.forEach(ev => {
              const opt = document.createElement("option");
              opt.value = ev["活動ID"];
              opt.textContent = `[${ev["活動ID"]}] ${ev["活動名稱"]}`;
              select.appendChild(opt);
            });
          }
        });
    }

    function fetchRegistrations() {
      const eventId = document.getElementById("selectEvent").value;
      const theadRow = document.getElementById("tableHeaderRow");
      const tbody = document.querySelector("#dataTable tbody");
      const loading = document.getElementById("regLoading");
      const searchInput = document.getElementById("searchEmailInput");

      if (!eventId) {
        theadRow.innerHTML = '<th>報名時間</th><th>Email</th>';
        tbody.innerHTML = '<tr><td colspan="2" class="no-data">請先選擇上方活動以檢視報名清單。</td></tr>';
        rawRegistrationsData = [];
        return;
      }

      loading.style.display = "block";
      tbody.innerHTML = "";

      fetch(`${GAS_URL}?action=getRegistrations&eventId=${encodeURIComponent(eventId)}&credential=${encodeURIComponent(currentCredential)}`)
        .then(res => res.json())
        .then(res => {
          loading.style.display = "none";
          if (res.status === "success" && res.data && res.data.length > 0) {
            rawRegistrationsData = res.data; // 暫存資料
            renderTableData(rawRegistrationsData);
          } else {
            rawRegistrationsData = [];
            theadRow.innerHTML = '<th>報名時間</th><th>Email</th>';
            tbody.innerHTML = '<tr><td colspan="2" class="no-data">目前尚無同學報名此活動。</td></tr>';
          }
        })
        .catch(err => {
          console.error(err);
          loading.style.display = "none";
          rawRegistrationsData = [];
          tbody.innerHTML = '<tr><td colspan="2" class="no-data" style="color: #cf222e;">載入資料失敗，請檢查網路！</td></tr>';
        });
    }

    // 渲染表格資料
    function renderTableData(dataList) {
      const theadRow = document.getElementById("tableHeaderRow");
      const tbody = document.querySelector("#dataTable tbody");
      tbody.innerHTML = "";

      if (!dataList || dataList.length === 0) {
        const colCount = theadRow.children.length || 2;
        tbody.innerHTML = `<tr><td colspan="${colCount}" class="no-data">查無符合搜尋條件的報名資料。</td></tr>`;
        return;
      }

      const firstRow = dataList[0];
      const keys = Object.keys(firstRow);

      let thHTML = '';
      keys.forEach(k => {
        thHTML += `<th>${k}</th>`;
      });
      theadRow.innerHTML = thHTML;

      dataList.forEach(row => {
        const tr = document.createElement("tr");
        let tdHTML = '';
        keys.forEach(k => {
          let val = row[k] || '';
          if (k === "報名時間" && val) val = new Date(val).toLocaleString();
          tdHTML += `<td>${val}</td>`;
        });
        tr.innerHTML = tdHTML;
        tbody.appendChild(tr);
      });
    }

    // 前端即時過濾（搜尋 Email / 全欄位關鍵字）
    function filterRegistrations() {
      const query = document.getElementById("searchEmailInput").value.trim().toLowerCase();
      if (!query) {
        renderTableData(rawRegistrationsData);
        return;
      }

      const filtered = rawRegistrationsData.filter(row => {
        return Object.values(row).some(val => {
          return String(val).toLowerCase().includes(query);
        });
      });

      renderTableData(filtered);
    }

    function submitCreateEvent() {
      const eventId = document.getElementById("newEventId").value.trim();
      const eventName = document.getElementById("newEventName").value.trim();
      const startTime = document.getElementById("newStartTime").value;
      const endTime = document.getElementById("newEndTime").value;
      const createMsg = document.getElementById("createMsg");
      const createBtn = document.getElementById("createBtn");

      if (!eventId || !eventName || !startTime || !endTime) {
        createMsg.style.display = "block";
        createMsg.className = "message error";
        createMsg.textContent = "❌ 請填寫所有必填欄位（活動 ID、名稱、開始與結束時間）！";
        return;
      }

      const qCards = document.querySelectorAll(".question-builder-card");
      let questions = [];
      qCards.forEach(card => {
        const label = card.querySelector(".q-label").value.trim();
        const type = card.querySelector(".q-type").value;
        const required = card.querySelector(".q-required").checked;
        const imageUrl = card.querySelector(".q-image-url").value;
        const minSelect = parseInt(card.querySelector(".q-min-select")?.value || 0);
        const maxSelect = parseInt(card.querySelector(".q-max-select")?.value || 0);
        
        let options = [];
        if (['radio', 'checkbox', 'select'].includes(type)) {
          const optRows = card.querySelectorAll(".option-item-row");
          optRows.forEach(row => {
            const text = row.querySelector(".option-input").value.trim();
            const isOther = row.querySelector(".option-is-other").checked;
            if (text || isOther) {
              options.push({ text: text || "其他", isOther: isOther });
            }
          });
        }

        if (label) {
          questions.push({ label, type, required, options, imageUrl, minSelect, maxSelect });
        }
      });

      if (questions.length === 0) {
        alert("請至少設定一個報名題目！");
        return;
      }

      createBtn.disabled = true;
      createBtn.textContent = "上傳中...";
      createMsg.style.display = "none";

      const payload = {
        action: "createEvent",
        credential: currentCredential, // 傳送 Access Token 供後端驗證權限
        eventId: eventId,
        eventName: eventName,
        eventDesc: document.getElementById("newEventDesc").value.trim(),
        startTime: startTime.replace("T", " "),
        endTime: endTime.replace("T", " "),
        questions: questions
      };

      fetch(GAS_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(res => {
        createMsg.style.display = "block";
        if (res.status === "success") {
          createMsg.className = "message success";
          createMsg.textContent = "✅ 活動與自訂題目建立成功！";
          loadAdminEvents();
        } else {
          createMsg.className = "message error";
          createMsg.textContent = "❌ 建立失敗：" + (res.message || "未知錯誤");
        }
      })
      .catch(err => {
        console.error(err);
        createMsg.style.display = "block";
        createMsg.className = "message error";
        createMsg.textContent = "❌ 建立失敗，請檢查網路連線或伺服器回應。";
      })
      .finally(() => {
        createBtn.disabled = false;
        createBtn.textContent = "送出建立 / 更新活動";
      });
    }

    function logout() {
      currentCredential = "";
      document.getElementById("loginSection").style.display = "flex";
      document.getElementById("adminContent").style.display = "none";
      document.getElementById("loginMsg").style.display = "none";
    }

    
    let consecutiveErrors = 0;

    function checkSystemStatus(isInitialCheck = false) {
      fetch(`${GAS_URL}?action=checkLockStatus&spreadsheetId=${TARGET_SHEET_ID}&_t=${Date.now()}`)
        .then(res => res.json())
        .then(res => {
          if (res && res.status === "success") {
            if (res.maintenance === true) {
              if (isInitialCheck) {
                consecutiveErrors++;
                if (consecutiveErrors >= 3) {
                  window.location.href = "maintenance.html";
                } else {
                  setTimeout(() => checkSystemStatus(true), 500);
                }
              } else {
                window.location.href = "maintenance.html";
              }
              return;
            }

            if (res.locked === true) {
              if (isInitialCheck) {
                consecutiveErrors++;
                if (consecutiveErrors >= 3) {
                  window.location.href = "lock.html";
                } else {
                  setTimeout(() => checkSystemStatus(true), 500);
                }
              } else {
                window.location.href = "lock.html";
              }
              return;
            }

            consecutiveErrors = 0;
          }
        })
        .catch(err => {
          console.debug("背景狀態同步暫時略過 (網路波動)", err);
        });
    }

    window.addEventListener("load", () => {
      if (window.location.pathname.includes("lock.html") || window.location.pathname.includes("maintenance.html")) return;

      checkSystemStatus(true);
      setInterval(() => {
        checkSystemStatus(false);
      }, 2000);
    });
  </script>
</body>
