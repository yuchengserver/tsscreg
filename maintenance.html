<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系統通知 - TSSC13TH 胡台校活動報名專區</title>
    <link rel="icon" tpye="image/png" href="tsscblack.png">
    <link rel="stylesheet" href="maintenance.css">
    
</head>
<body>

    <div class="card">
        <div class="icon-box">
            ⚠️
        </div>

        <div class="title">系統通知</div>

        <div class="main-message">
            系統正在維護更新中
        </div>

        <div class="sub-message">
            維護期間將暫時停止活動報名等功能，造成不便，敬請見諒
        </div>

        <!-- 預計恢復時間顯示區塊 -->
        <div id="timeBox" class="time-text" style="display: none;">
            ⏰ 預計恢復使用時間：<span id="maintenanceTimeText"></span>
        </div>

        <div class="footer-org">
            胡志明市台灣學校學生會 TSSC13TH
        </div>

        <div>
            <div class="badge-status">
                🛠️ 系統目前處於維護狀態
            </div>
        </div>
    </div>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbzw8vASm3Nm7eIpcQYQ_QBMK4m3j0d9Thcw8N8nWBsuUPJDCsioB_KLErcH1nIP2v0/exec';

        function checkMaintenanceStatus() {
            fetch(`${GAS_URL}?action=checkLockStatus&_t=${Date.now()}`)
                .then(res => res.json())
                .then(data => {
                    if (data && data.status === "success") {
                        // 1. 動態綁定並顯示 B3 預計恢復時間
                        const timeBox = document.getElementById('timeBox');
                        const timeText = document.getElementById('maintenanceTimeText');
                        if (data.maintenanceTime && data.maintenanceTime.trim() !== "") {
                            timeText.innerText = data.maintenanceTime;
                            timeBox.style.display = 'inline-block';
                        } else {
                            timeBox.style.display = 'none';
                        }

                        // 2. 若為完全鎖定模式，跳轉到 lock.html
                        if (data.locked === true) {
                            window.location.href = 'lock.html';
                            return;
                        }

                        // 3. 唯有當維護與鎖定皆解除時，才安全返回首頁
                        if (data.maintenance === false && data.locked === false) {
                            window.location.href = 'index.html';
                        }
                    }
                })
                .catch(err => console.debug('維護狀態監控中...', err));
        }

        window.onload = function() {
            checkMaintenanceStatus();
            setInterval(checkMaintenanceStatus, 2000);
        };
    </script>
</body>
</html>
