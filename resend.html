<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TSSC13TH - 查詢我的報名紀錄</title>
  <link rel="icon" type="image/png" href="tsscblack.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="resend.css">
  
  <!-- 引入 Google Identity Services SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <header class="navbar">
    <a href="index.html" class="nav-brand">
      <img src="tsscblack.png" alt="TSSC Logo" class="nav-logo">
      <span>TSSC13TH 活動報名專區</span>
    </a>
    <div class="nav-menu">
      <a href="index.html" class="nav-btn">首頁與通知</a>
      <a href="resend.html" class="nav-btn active">🔍 查詢我的報名</a>
    </div>
  </header>

  <div class="container wide" style="padding-bottom: 30px;">
    <!-- 1. 驗證區塊 (預設顯示) -->
    <div id="authSection">
      <div class="login-card-wrapper">
        <div class="login-card">
          <h2>查詢與管理報名紀錄</h2>
          <p class="login-subtitle">請使用學校官方信箱（<code>@tshcmc.edu.vn</code>）進行 Google 驗證，即可自動檢視與管理您的報名活動。</p>

          <div class="login-form">
            <!-- 未登入時顯示 Google 登入按鈕 -->
            <div id="loginPromptBox">
              <button type="button" id="customGoogleBtn" class="btn-google-custom">
                <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.63-.06-1.25-.16-1.84H9v3.49h4.84c-.21 1.12-.86 2.07-1.83 2.71v2.26h2.97c1.74-1.6 2.66-3.95 2.66-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.97-2.26c-.81.54-1.84.86-2.99.86-2.31 0-4.27-1.56-4.97-3.66H1.02v2.33C2.53 15.93 5.51 18 9 18z"/><path fill="#FBBC05" d="M4.03 10.76c-.18-.54-.28-1.13-.28-1.76s.1-1.22.28-1.76V4.91H1.02C.37 6.22 0 7.7 0 9.29s.37 3.07 1.02 4.38l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.51 0 2.53 2.07 1.02 4.91l3.01 2.33c.7-2.1 2.66-3.66 4.97-3.66z"/></svg>
                使用學校 Google 帳號登入查詢
              </button>
            </div>
            
            <!-- 隱藏欄位儲存 Token 與 Email -->
            <input type="hidden" id="googleCredential">
            <input type="hidden" id="verifiedEmail">
          </div>

          <!-- 錯誤或狀態通知框 -->
          <div id="loginMsgBox" style="display: none; margin-top: 20px; background-color: #ffeef0; border: 1px solid #ffc1c0; color: #cf222e; padding: 12px 16px; border-radius: 8px; font-size: 14px; font-weight: 600; text-align: center;">
            <span id="loginMsgText"></span>
          </div>

          <!-- 完美收納在白色卡片內最下方的版權聲明 -->
          <div class="login-footer" style="margin-top: 35px; text-align: center; color: #6e7781; font-size: 13px;">
            胡志明市臺灣學校學生會 TSSC13TH © 2026 yucheng
          </div>
        </div>
      </div>
    </div>

    <!-- 2. 查詢結果清單區塊 -->
    <div id="resultsContainer" style="display: none; margin-top: 20px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: #ffffff; padding: 16px 20px; border-radius: 12px; border: 1px solid #e1e4e8;">
        <div>
          <h3 style="margin: 0 0 4px 0; font-size: 18px; color: #1f2328;">📋 您的報名紀錄清單</h3>
          <p id="userEmailDisplay" style="margin: 0; color: #57606a; font-size: 13px;"></p>
        </div>
        <button type="button" onclick="resetToAuth()" class="btn-secondary" style="width: auto; padding: 6px 14px; background-color: #f6f8fa; border: 1px solid #d0d7de; cursor: pointer; border-radius: 6px; font-size: 13px; font-weight: 600; color: #cf222e;">🔒 切換帳號</button>
      </div>
      <div id="recordsGrid" class="event-grid"></div>
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzw8vASm3Nm7eIpcQYQ_QBMK4m3j0d9Thcw8N8nWBsuUPJDCsioB_KLErcH1nIP2v0/exec";
    const TARGET_SHEET_ID = "18fxfF-BnNlDnhCH0NORbNeWXKSo1KHmljfPCkpvJTKo";
    const GOOGLE_CLIENT_ID = "434067788519-ivv0ms7qobv7s5s7an8go152v8adc64l.apps.googleusercontent.com";

    let allEventsMap = {};
    let googleTokenClient = null;

    const IDLE_TIMEOUT = 30 * 60 * 1000; // 30 分鐘
    let idleTimer = null;

    function forceLogout() {
      clearTimeout(idleTimer);
      sessionStorage.clear();
      logoutGoogle();
    }

    function resetIdleTimer() {
      clearTimeout(idleTimer);
      const isUserLoggedIn = sessionStorage.getItem("isLoggedIn") === "true" ||
                             (document.getElementById("verifiedEmail") && document.getElementById("verifiedEmail").value);

      if (isUserLoggedIn) {
        idleTimer = setTimeout(() => {
          alert("⚠️ 您已超過 30 分鐘未操作，為了帳號安全，系統已自動登入。");
          resetToAuth();
        }, IDLE_TIMEOUT);
      }
    }

    ['mousemove', 'keydown', 'click', 'scroll', 'touchstart'].forEach(eventType => {
      window.addEventListener(eventType, resetIdleTimer, { passive: true });
    });

    function validateSchoolEmail(email) {
      if (!email) return false;
      return email.toLowerCase().endsWith("@tshcmc.edu.vn");
    }

    window.onload = function() {
      if (!sessionStorage.getItem("isLoggedIn")) {
        forceLogout();
      }

      if (typeof google !== 'undefined') {
        googleTokenClient = google.accounts.oauth2.initTokenClient({
          client_id: GOOGLE_CLIENT_ID,
          scope: 'email profile openid',
          callback: (response) => {
            if (response.access_token) {
              fetchGoogleUserInfo(response.access_token);
            } else {
              showNotification("❌ Google 授權失敗或被取消。", "error");
            }
          },
        });

        document.getElementById("customGoogleBtn").addEventListener("click", () => {
          document.getElementById("loginMsgBox").style.display = "none";
          googleTokenClient.requestAccessToken();
        });
      }

      loadAllEvents();
    };

    function showNotification(msg, type = "error") {
      const box = document.getElementById("loginMsgBox");
      const text = document.getElementById("loginMsgText");
      text.textContent = msg;
      
      if (type === "loading") {
        box.style.backgroundColor = "#e6fcf5";
        box.style.borderColor = "#c3fae8";
        box.style.color = "#0ca678";
      } else {
        box.style.backgroundColor = "#ffeef0";
        box.style.borderColor = "#ffc1c0";
        box.style.color = "#cf222e";
      }
      box.style.display = "block";
    }

    function fetchGoogleUserInfo(accessToken) {
      // 立即顯示載入中提示，消除等待時的焦慮感
      showNotification("⏳ 正在驗證身分並載入紀錄，請稍候...", "loading");

      fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
        headers: { 'Authorization': `Bearer ${accessToken}` }
      })
      .then(res => res.json())
      .then(userInfo => {
        const email = userInfo.email ? userInfo.email.trim().toLowerCase() : "";

        if (!email) {
          showNotification("❌ 無法取得 Google 帳號信箱，請重新授權！", "error");
          return;
        }

        if (!validateSchoolEmail(email)) {
          showNotification(`❌ 驗證失敗：帳號 (${email}) 必須為學校官方信箱 (@tshcmc.edu.vn)！`, "error");
          return;
        }

        document.getElementById("googleCredential").value = accessToken;
        document.getElementById("verifiedEmail").value = email;
        
        sessionStorage.setItem("isLoggedIn", "true");
        resetIdleTimer();

        // 串接後端查詢
        fetchMyRegistrations(email, accessToken);
      })
      .catch(err => {
        console.error("Google UserInfo 錯誤：", err);
        showNotification("❌ Google 登入驗證發生錯誤，請重試！", "error");
      });
    }

    function logoutGoogle() {
      clearTimeout(idleTimer);
      sessionStorage.removeItem("isLoggedIn");
      const cred = document.getElementById("googleCredential");
      const email = document.getElementById("verifiedEmail");
      const msgBox = document.getElementById("loginMsgBox");
      if (cred) cred.value = "";
      if (email) email.value = "";
      if (msgBox) msgBox.style.display = "none";
    }

    function loadAllEvents() {
      return fetch(`${GAS_URL}?action=getEvents`)
        .then(res => res.json())
        .then(res => {
          if (res.status === "success" && res.data) {
            res.data.forEach(ev => {
              allEventsMap[ev["活動ID"]] = ev;
            });
          }
        });
    }

    async function fetchMyRegistrations(email, credential) {
      const authSection = document.getElementById("authSection");
      const resultsContainer = document.getElementById("resultsContainer");
      const recordsGrid = document.getElementById("recordsGrid");
      const userEmailDisplay = document.getElementById("userEmailDisplay");

      if (!validateSchoolEmail(email) || !credential) {
        return;
      }

      await loadAllEvents();

      fetch(`${GAS_URL}?action=getMyRegistrations&email=${encodeURIComponent(email)}&credential=${encodeURIComponent(credential)}`)
        .then(res => res.json())
        .then(res => {
          if (res.status === "success") {
            authSection.style.display = "none";
            resultsContainer.style.display = "block";
            userEmailDisplay.textContent = `已驗證登入信箱：${email}`;
            recordsGrid.innerHTML = "";

            const records = res.data;
            if (records.length === 0) {
              recordsGrid.innerHTML = "<p class='no-data' style='grid-column: 1/-1; text-align: center; padding: 40px; color: #57606a; background: #fff; border-radius: 12px; border: 1px solid #e1e4e8;'>目前查無您的報名紀錄。</p>";
              return;
            }

            const now = new Date();

            records.forEach(rec => {
              const eventId = rec["活動ID"];
              const eventInfo = allEventsMap[eventId] || {};
              const eventName = eventInfo["活動名稱"] || eventId;
              const startTime = eventInfo["開始時間"] ? new Date(eventInfo["開始時間"]) : null;
              const endTime = eventInfo["結束時間"] ? new Date(eventInfo["結束時間"]) : null;

              const isOpen = (startTime && endTime && now >= startTime && now < endTime);

              let detailsHTML = "";
              for (let key in rec) {
                if (key !== "報名時間" && key !== "活動ID" && key !== "email") {
                  detailsHTML += `<li><strong>${key}：</strong>${rec[key]}</li>`;
                }
              }

              let actionHTML = "";
              if (isOpen) {
                actionHTML = `
                  <div style="display: flex; gap: 10px; margin-top: 15px;">
                    <a href="signup.html?eventId=${encodeURIComponent(eventId)}" class="btn-card-action btn-card-active" style="flex:1; text-align:center;">🔄 重新報名 / 修改</a>
                    <button onclick="cancelReg('${email}', '${eventId}', '${credential}')" class="btn-card-action" style="flex:1; background-color: #ffeef0; color: #cf222e; border: 1px solid #ffc1c0; cursor:pointer; border-radius:6px; font-weight:600;">❌ 取消報名</button>
                  </div>
                `;
              } else {
                actionHTML = `<p style="margin-top: 15px; color: #57606a; font-size: 13px;">🔒 該活動已截止或尚未開放，目前僅能檢視報名資料。</p>`;
              }

              const card = document.createElement("div");
              card.className = "event-card";
              card.innerHTML = `
                <div class="card-body">
                  <h3 class="card-title">${eventName}</h3>
                  <p class="card-desc"><strong>報名時間：</strong>${new Date(rec["報名時間"]).toLocaleString()}</p>
                  <ul style="list-style: none; padding: 0; margin-top: 10px; font-size: 14px; color: #24292f;">
                    ${detailsHTML}
                  </ul>
                </div>
                <div class="card-footer" style="display: block; padding: 15px;">
                  ${actionHTML}
                </div>
              `;
              recordsGrid.appendChild(card);
            });

          } else {
            showNotification(res.message || "查詢失敗，請稍後再試。", "error");
          }
        })
        .catch(err => {
          console.error(err);
          showNotification("連線伺服器失敗，請檢查網路連線。", "error");
        });
    }

    function cancelReg(email, eventId, credential) {
      if (!confirm("確定要取消此活動的報名嗎？")) return;

      fetch(GAS_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "cancelRegistration", email, eventId, credential })
      })
      .then(res => res.json())
      .then(res => {
        alert(res.message);
        if (res.status === "success") {
          const emailVal = document.getElementById("verifiedEmail").value;
          const credVal = document.getElementById("googleCredential").value;
          fetchMyRegistrations(emailVal, credVal);
        }
      })
      .catch(err => {
        alert("操作失敗，請稍後再試。");
      });
    }

    function resetToAuth() {
      forceLogout();
      document.getElementById("resultsContainer").style.display = "none";
      document.getElementById("authSection").style.display = "block";
    }

    window.addEventListener("beforeunload", () => {
      forceLogout();
    });

    let consecutiveErrors = 0;
    function checkSystemStatus() {
      fetch(`${GAS_URL}?action=checkLockStatus&spreadsheetId=${TARGET_SHEET_ID}&_t=${Date.now()}`)
        .then(res => res.json())
        .then(res => {
          if (res && res.status === "success") {
            if (res.maintenance === true) {
              window.location.href = "maintenance.html";
              return;
            }
            if (res.locked === true) {
              window.location.href = "lock.html";
              return;
            }
          }
        });
    }

    window.addEventListener("load", () => {
      checkSystemStatus();
      setInterval(() => checkSystemStatus(), 2000);
    });
  </script>
</body>
</html>
