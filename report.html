<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TSSC13TH - AI 智慧客服與申訴中心</title>
  <link rel="icon" type="image/png" href="tsscblack.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="report.css">
  
  <!-- 引入 Google Identity Services SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <header class="navbar">
    <a href="index.html" class="nav-brand">
      <img src="tsscblack.png" alt="TSSC Logo" class="nav-logo">
      <span>TSSC13TH 活動報名專區</span>
    </a>
    <div class="nav-menu">
      <a href="index.html" class="nav-btn">首頁與通知</a>
      <a href="resend.html" class="nav-btn">查詢我的報名</a>
      <a href="report.html" class="nav-btn active">問題申訴中心</a>
    </div>
  </header>

  <div class="report-wrapper">
    
    <!-- 1. 身分驗證登入卡片 -->
    <div id="authSection" class="report-card" style="text-align: center; max-width: 520px; margin: 40px auto;">
      <h2 class="report-title">🤖 AI 智慧客服與申訴中心</h2>
      <p class="report-subtitle">請先使用學校官方信箱（<code>@tshcmc.edu.vn</code>）進行身分驗證以啟動對話系統</p>

      <div style="margin: 30px auto; max-width: 320px;">
        <button type="button" id="customGoogleBtn" class="report-google-btn">
          <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.63-.06-1.25-.16-1.84H9v3.49h4.84c-.21 1.12-.86 2.07-1.83 2.71v2.26h2.97c1.74-1.6 2.66-3.95 2.66-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.97-2.26c-.81.54-1.84.86-2.99.86-2.31 0-4.27-1.56-4.97-3.66H1.02v2.33C2.53 15.93 5.51 18 9 18z"/><path fill="#FBBC05" d="M4.03 10.76c-.18-.54-.28-1.13-.28-1.76s.1-1.22.28-1.76V4.91H1.02C.37 6.22 0 7.7 0 9.29s.37 3.07 1.02 4.38l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.51 0 2.53 2.07 1.02 4.91l3.01 2.33c.7-2.1 2.66-3.66 4.97-3.66z"/></svg>
          使用學校 Google 帳號登入
        </button>
      </div>

      <div id="loginMsgBox" style="display: none;" class="report-msg error"></div>

      <div class="login-footer" style="margin-top: 35px; text-align: center; color: #6e7781; font-size: 13px;">
        胡志明市臺灣學校學生會 TSSC13TH © 2026 yucheng
      </div>
    </div>

    <!-- 2. AI 對話客服與動態申訴介面 (登入後顯示) -->
    <div id="chatSection" class="report-card" style="display: none; padding: 0; overflow: hidden; max-width: 760px; margin: 20px auto;">
      
      <!-- 對話頂部導覽 -->
      <div style="background: #1f2328; color: #fff; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center;">
        <div>
          <h3 style="margin: 0; font-size: 16px; display: flex; align-items: center; gap: 8px;">🤖 TSSC13TH AI 智慧助理</h3>
          <p id="chatUserEmail" style="margin: 2px 0 0 0; font-size: 12px; color: #8b949e;"></p>
        </div>
        <div style="display: flex; gap: 10px; align-items: center;">
          <button type="button" onclick="triggerManualForm()" style="background: #238636; border: none; color: #fff; padding: 5px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer;">📝 填寫詳細申訴單</button>
          <button type="button" onclick="resetToAuth()" style="background: transparent; border: 1px solid #30363d; color: #f85149; padding: 5px 10px; border-radius: 6px; font-size: 12px; cursor: pointer;">登出</button>
        </div>
      </div>

      <!-- 資安與個資提醒橫幅 -->
      <div style="background: #fff8c5; border-bottom: 1px solid #faf089; color: #594500; padding: 10px 20px; font-size: 12px; line-height: 1.4;">
        ⚠️ <strong>資安宣告：</strong>請勿隨意查詢非自己之資訊。所有對話與查詢皆會完整記錄稽核日誌，違者依校規移送學務處。
      </div>

      <!-- 對話泡泡卷軸區 -->
      <div id="chatMessages" style="padding: 20px; height: 360px; overflow-y: auto; background: #f6f8fa; display: flex; flex-direction: column; gap: 15px;">
        <!-- 動態對話由 JS 產生 -->
      </div>

      <!-- AI 訊息輸入框 -->
      <div style="padding: 15px 20px; background: #ffffff; border-top: 1px solid #d0d7de; display: flex; gap: 10px; align-items: center;">
        <input type="text" id="userInputText" class="report-control" placeholder="請輸入您的姓名、座號，或輸入「申訴單」尋求人工協助..." style="flex: 1; margin: 0;" onkeypress="if(event.key === 'Enter') handleUserSubmit()">
        <button type="button" onclick="handleUserSubmit()" class="report-btn" style="width: auto; padding: 10px 22px;">傳送</button>
      </div>

      <!-- 3. 動態彈出/展開的詳細申訴單 (當 AI 無法解決或輸入申訴單時顯示) -->
      <div id="appealFormContainer" style="display: none; background: #ffffff; border-top: 2px dashed #0969da; padding: 25px 30px; box-sizing: border-box; animation: fadeIn 0.3s ease;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
          <h4 style="margin: 0; font-size: 18px; color: #1f2328;">📋 專屬人工申訴與報名協助申請單</h4>
          <button type="button" onclick="closeAppealForm()" style="background: transparent; border: none; color: #57606a; font-size: 16px; cursor: pointer;">✕</button>
        </div>
        <p style="margin: 0 0 20px 0; font-size: 13px; color: #57606a;">請詳細填寫下方欄位，後台管理員將透過您的學校信箱進行審核與跟進處理。</p>

        <div style="margin-bottom: 15px;">
          <label class="report-label">申訴與協助類別 <span style="color:red;">*</span></label>
          <select id="detailedReportType" class="report-control">
            <option value="遭人惡意亂報名（冒名頂替）申訴">🚨 遭人惡意亂報名（冒名頂替）申訴</option>
            <option value="報名資料填寫錯誤（如姓名、座號、選項）修改請求">✏️ 報名資料填寫錯誤（如姓名、座號、選項）修改請求</option>
            <option value="系統操作障礙 / 登入驗證失敗 / 畫面異常">💻 系統操作障礙 / 登入驗證失敗 / 畫面異常</option>
            <option value="重複報名衝突 / 系統未記錄處理">🔄 重複報名衝突 / 系統未記錄處理</option>
            <option value="活動時間、規則疑問與其他協助">❓ 活動時間、規則疑問與其他協助</option>
          </select>
        </div>

        <div style="margin-bottom: 15px;">
          <label class="report-label">相關活動名稱或活動 ID (選填)</label>
          <input type="text" id="appealEventName" class="report-control" placeholder="例如：ACT001 或 第一屆科技營">
        </div>

        <div style="margin-bottom: 20px;">
          <label class="report-label">詳細狀況說明與佐證細節 <span style="color:red;">*</span></label>
          <textarea id="appealMessage" class="report-control" placeholder="請詳細描述您遇到的問題、發生時間、欲更改的正確內容或被亂報名的情況..." rows="4"></textarea>
        </div>

        <div style="display: flex; gap: 10px;">
          <button type="button" onclick="submitDetailedAppeal()" class="report-btn" style="flex: 1; background-color: #238636;">確認無誤，送出正式申訴單</button>
          <button type="button" onclick="closeAppealForm()" class="report-btn" style="flex: 0 0 100px; background-color: #6e7781;">取消</button>
        </div>

        <div id="appealFormMsg" style="display: none; margin-top: 15px;" class="report-msg"></div>
      </div>

    </div>

  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxvQE1r_EAzlP7jZpMGRzULiMOQIRjyKxMQu8R-Z0WyksZnegrV5cISVlpVT-ngBA/exec";
    const GOOGLE_CLIENT_ID = "434067788519-ivv0ms7qobv7s5s7an8go152v8adc64l.apps.googleusercontent.com";

    let googleTokenClient = null;
    let globalEventsCache = [];
    let globalAllRegistrations = [];
    let matchedRecordCache = null;

    const IDLE_TIMEOUT = 30 * 60 * 1000;
    let idleTimer = null;

    function forceLogout() {
      clearTimeout(idleTimer);
      sessionStorage.clear();
      logoutGoogle();
    }

    function resetIdleTimer() {
      clearTimeout(idleTimer);
      if (sessionStorage.getItem("isLoggedIn") === "true") {
        idleTimer = setTimeout(() => {
          alert("⚠️ 系統閒置超過 30 分鐘，為了資安與個資保護已自動登出。");
          resetToAuth();
        }, IDLE_TIMEOUT);
      }
    }

    ['mousemove', 'keydown', 'click', 'scroll', 'touchstart'].forEach(eventType => {
      window.addEventListener(eventType, resetIdleTimer, { passive: true });
    });

    function validateSchoolEmail(email) {
      return email && email.toLowerCase().endsWith("@tshcmc.edu.vn");
    }

    window.onload = function() {
      if (!sessionStorage.getItem("isLoggedIn")) {
        forceLogout();
      } else {
        const email = sessionStorage.getItem("verifiedEmail");
        if (email) {
          startAiChatSession(email);
        }
      }

      if (typeof google !== 'undefined') {
        googleTokenClient = google.accounts.oauth2.initTokenClient({
          client_id: GOOGLE_CLIENT_ID,
          scope: 'email profile openid',
          callback: (response) => {
            if (response.access_token) {
              fetchGoogleUserInfo(response.access_token);
            } else {
              showNotification("❌ Google 授權失敗。", "error");
            }
          },
        });

        document.getElementById("customGoogleBtn").addEventListener("click", () => {
          document.getElementById("loginMsgBox").style.display = "none";
          googleTokenClient.requestAccessToken();
        });
      }

      preloadSystemData();
    };

    function showNotification(msg, type = "error") {
      const box = document.getElementById("loginMsgBox");
      box.textContent = msg;
      box.className = `report-msg ${type}`;
      box.style.display = "block";
    }

    function fetchGoogleUserInfo(accessToken) {
      showNotification("正在驗證學校身分...", "success");

      fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
        headers: { 'Authorization': `Bearer ${accessToken}` }
      })
      .then(res => res.json())
      .then(userInfo => {
        const email = userInfo.email ? userInfo.email.trim().toLowerCase() : "";
        if (!validateSchoolEmail(email)) {
          showNotification(`❌ 驗證失敗：帳號 (${email}) 必須為學校官方信箱 (@tshcmc.edu.vn)！`, "error");
          return;
        }

        sessionStorage.setItem("isLoggedIn", "true");
        sessionStorage.setItem("verifiedEmail", email);
        sessionStorage.setItem("googleCredential", accessToken);
        resetIdleTimer();

        document.getElementById("authSection").style.display = "none";
        document.getElementById("chatSection").style.display = "block";
        startAiChatSession(email);
      })
      .catch(err => {
        showNotification("❌ 驗證發生錯誤，請重試。", "error");
      });
    }

    function logoutGoogle() {
      clearTimeout(idleTimer);
      sessionStorage.clear();
      document.getElementById("loginMsgBox").style.display = "none";
    }

    function resetToAuth() {
      forceLogout();
      document.getElementById("chatSection").style.display = "none";
      document.getElementById("authSection").style.display = "block";
    }

    function preloadSystemData() {
      fetch(`${GAS_URL}?action=getAllSystemData`)
        .then(res => res.json())
        .then(res => {
          if (res.status === "success") {
            globalEventsCache = res.events || [];
            globalAllRegistrations = res.registrations || [];
          }
        })
        .catch(err => console.debug("預載系統資料失敗", err));
    }

    function startAiChatSession(email) {
      document.getElementById("chatUserEmail").textContent = `已驗證身分：${email}`;
      const chatBox = document.getElementById("chatMessages");
      chatBox.innerHTML = "";

      appendBotBubble(`👋 您好！我是 <strong>TSSC13TH AI 智慧客服助理</strong>。<br>
      我可以幫您在全系統資料庫中智慧檢索報名紀錄、檢查是否遭到冒名，或協助您轉交人工審核。<br><br>
      請直接告訴我您的<strong>姓名、座號</strong>，或者輸入任何想問的問題。若需要人工處理，隨時可以輸入<strong>「申訴單」</strong>！`);
    }

    function appendBotBubble(html) {
      const chatBox = document.getElementById("chatMessages");
      const div = document.createElement("div");
      div.style.cssText = "display: flex; align-items: flex-start; gap: 10px; max-width: 90%;";
      div.innerHTML = `
        <div style="width: 34px; height: 34px; background: #1f2328; color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0;">🤖</div>
        <div style="background: #ffffff; border: 1px solid #d0d7de; padding: 14px 18px; border-radius: 12px; font-size: 14px; color: #24292f; line-height: 1.6; box-shadow: 0 2px 5px rgba(0,0,0,0.02);">${html}</div>
      `;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function appendUserBubble(text) {
      const chatBox = document.getElementById("chatMessages");
      const div = document.createElement("div");
      div.style.cssText = "display: flex; align-items: flex-start; gap: 10px; max-width: 90%; align-self: flex-end;";
      div.innerHTML = `
        <div style="background: #0969da; color: #ffffff; padding: 14px 18px; border-radius: 12px; font-size: 14px; line-height: 1.6;">${text}</div>
        <div style="width: 34px; height: 34px; background: #0969da; color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0;">👤</div>
      `;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function handleUserSubmit() {
      const input = document.getElementById("userInputText");
      const text = input.value.trim();
      if (!text) return;

      appendUserBubble(text);
      input.value = "";

      const lowerText = text.toLowerCase();

      // 檢查是否包含觸發申訴單的關鍵字
      if (lowerText.includes("申訴單") || lowerText.includes("人工") || lowerText.includes("轉交") || lowerText.includes("管理員") || lowerText.includes("錯了") || lowerText.includes("沒辦法") || lowerText.includes("幫忙")) {
        appendBotBubble(`沒問題！AI 已經為您準備好專屬的<strong>人工申訴與報名協助申請單</strong>。<br>請直接在下方填寫詳細狀況，送出後管理員會盡快協助您處理：`);
        triggerManualForm();
        logAuditTrail(text, "使用者主動要求申訴單/人工協助");
        return;
      }

      // 執行智慧檢索
      processAiSearch(text);
    }

    function calculateSimilarity(keyword, text) {
      const kw = keyword.toLowerCase();
      const txt = text.toLowerCase();
      if (txt.includes(kw)) {
        return Math.min(100, Math.round((kw.length / txt.length) * 50 + 50));
      }
      let matches = 0;
      for (let i = 0; i < kw.length; i++) {
        if (txt.includes(kw[i])) matches++;
      }
      return Math.round((matches / kw.length) * 100);
    }

    function processAiSearch(query) {
      appendBotBubble(`🔍 AI 正在全系統資料庫中比對「${query}」的紀錄與相似度...`);

      const email = sessionStorage.getItem("verifiedEmail");
      const credential = sessionStorage.getItem("googleCredential");

      fetch(`${GAS_URL}?action=getAllSystemData`)
        .then(res => res.json())
        .then(res => {
          if (res.status === "success") {
            globalEventsCache = res.events || [];
            globalAllRegistrations = res.registrations || [];

            let bestMatch = null;
            let highestScore = 0;

            globalAllRegistrations.forEach(reg => {
              for (let key in reg) {
                if (key !== "報名時間" && key !== "活動ID" && key !== "email") {
                  const val = String(reg[key] || "");
                  const score = calculateSimilarity(query, val);
                  if (score > highestScore) {
                    highestScore = score;
                    bestMatch = reg;
                  }
                }
              }
            });

            // 門檻 50%
            if (bestMatch && highestScore >= 50) {
              matchedRecordCache = bestMatch;
              const ev = globalEventsCache.find(e => e["活動ID"] === bestMatch["活動ID"]) || {};
              const eventName = ev["活動名稱"] || bestMatch["活動ID"];

              let details = "";
              for (let k in bestMatch) {
                if (k !== "報名時間" && k !== "活動ID" && k !== "email") {
                  details += `• ${k}：${bestMatch[k]}<br>`;
                }
              }

              appendBotBubble(`✅ <strong>AI 找到與您查詢高度相似的紀錄（相似度：${highestScore}%）：</strong><br>
                - 活動名稱：${eventName}<br>
                - 登記信箱：${bestMatch.email}<br>
                ${details}<br>
                若這筆資料不是您本人操作（遭人惡意亂報名），您可以點擊下方按鈕提出檢舉，或輸入<strong>「申訴單」</strong>填寫修改要求。`);

              // 動態加入快速操作按鈕
              setTimeout(() => {
                const chatBox = document.getElementById("chatMessages");
                const btnDiv = document.createElement("div");
                btnDiv.style.cssText = "display: flex; gap: 10px; margin-left: 44px;";
                btnDiv.innerHTML = `
                  <button type="button" onclick="quickCancelAppeal()" style="background: #cf222e; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600;">🚨 檢舉：遭人惡意亂報名，請求刪除</button>
                  <button type="button" onclick="triggerManualForm()" style="background: #f6f8fa; border: 1px solid #d0d7de; color: #1f2328; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px;">📝 填寫申訴單修改資料</button>
                `;
                chatBox.appendChild(btnDiv);
                chatBox.scrollTop = chatBox.scrollHeight;
              }, 300);

              logAuditTrail(query, `AI 找到相似紀錄 (${highestScore}%) 活動ID: ${bestMatch["活動ID"]}`);

            } else {
              matchedRecordCache = null;
              appendBotMessage(`⚠️ <strong>AI 無法確認相符的紀錄（最高相似度：${highestScore}% 低於 50% 標準）。</strong><br>
              您可以嘗試換個關鍵字（例如輸入正確的姓名或座號），或者直接點擊右上角或下方按鈕<strong>「填寫詳細申訴單」</strong>交由人工管理員為您處理！`);

              logAuditTrail(query, `AI 查無相符紀錄 (最高相似度 ${highestScore}%)`);
            }

          } else {
            appendBotMessage(`⚠️ 系統查詢忙碌中，請稍後再試或直接填寫申訴單。`);
          }
        })
        .catch(err => {
          appendBotMessage(`❌ 連線伺服器失敗，請檢查網路。`);
        });
    }

    function quickCancelAppeal() {
      if (!matchedRecordCache) return;
      if (!confirm("確定要針對此筆登記提出惡意亂報名檢舉並請求後台刪除嗎？")) return;

      const email = sessionStorage.getItem("verifiedEmail");
      const credential = sessionStorage.getItem("googleCredential");
      const payload = {
        action: "submitReportAudit",
        email: email,
        credential: credential,
        reportType: "AI對話快速檢舉：遭人亂報名",
        message: `使用者透過AI對話檢舉亂報名。活動ID: ${matchedRecordCache["活動ID"]}, 目標Gmail: ${matchedRecordCache["email"]}, 詳情: ${JSON.stringify(matchedRecordCache)}`
      };

      fetch(GAS_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(res => {
        appendBotMessage(`✅ <strong>檢舉申訴已成功送達！</strong> 後台管理員將會盡快審核並協助您處理。`);
      });
    }

    function triggerManualForm() {
      document.getElementById("appealFormContainer").style.display = "block";
      document.getElementById("appealFormContainer").scrollIntoView({ behavior: 'smooth' });
    }

    function closeAppealForm() {
      document.getElementById("appealFormContainer").style.display = "none";
    }

    function submitDetailedAppeal() {
      const email = sessionStorage.getItem("verifiedEmail");
      const credential = sessionStorage.getItem("googleCredential");
      const reportType = document.getElementById("detailedReportType").value;
      const eventName = document.getElementById("appealEventName").value.trim();
      const message = document.getElementById("appealMessage").value.trim();
      const msgBox = document.getElementById("appealFormMsg");

      if (!message) {
        alert("請填寫詳細狀況說明！");
        return;
      }

      const fullMessage = `[活動名稱/ID: ${eventName || "未填寫"}] ${message}`;

      const payload = {
        action: "submitReportAudit",
        email: email,
        credential: credential,
        reportType: reportType,
        message: fullMessage
      };

      fetch(GAS_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(res => {
        msgBox.style.display = "block";
        if (res.status === "success") {
          msgBox.className = "report-msg success";
          msgBox.textContent = "✅ 正式申訴單已成功送出！管理員處理後將以信箱通知您。";
          document.getElementById("appealMessage").value = "";
          document.getElementById("appealEventName").value = "";
          setTimeout(closeAppealForm, 2500);
          appendBotMessage(`✅ 您的正式申訴單已順利建立並送交後台審核，請靜候管理員回覆。`);
        } else {
          msgBox.className = "report-msg error";
          msgBox.textContent = res.message || "送出失敗。";
        }
      })
      .catch(err => {
        msgBox.style.display = "block";
        msgBox.className = "report-msg error";
        msgBox.textContent = "連線伺服器失敗。";
      });
    }

    function logAuditTrail(query, reply) {
      const email = sessionStorage.getItem("verifiedEmail");
      const credential = sessionStorage.getItem("googleCredential");

      fetch(GAS_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          action: "logQueryAudit",
          email: email,
          credential: credential,
          queryType: "AI對話資安稽核",
          queryString: query,
          systemReply: reply
        })
      }).catch(err => {});
    }
  </script>
