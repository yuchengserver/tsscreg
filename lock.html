<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TSSC13TH - 系統通知</title>
    <link rel="icon" type="image/png" href="tsscblack.png">
    <link rel="stylesheet" href="lock.css">
</head>
<body>

    <div class="lock-card">
        <!-- 黃色警告圖示 + 外圍閃爍紅光 -->
        <div class="icon-container">
            ⚠️
        </div>

        <!-- 標題與內文 -->
        <div class="title">系統通知</div>
        <div class="main-message">系統連線異常，目前已鎖定</div>
        <div class="sub-message">詳情請洽 TSSC13TH學生會</div>

        <div class="contact-info">
            詳情請洽 TSSC13TH 學生會
        </div>

        <div class="divider"></div>

        <!-- 組織署名與鎖定標籤 -->
        <div class="org-title">
            胡志明市台灣學校學生會 TSSC13TH
        </div>

        <div class="badge-locked">
            🔒 系統目前已全面鎖定
        </div>
    </div>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbzw8vASm3Nm7eIpcQYQ_QBMK4m3j0d9Thcw8N8nWBsuUPJDCsioB_KLErcH1nIP2v0/exec';

        // 🔓 嚴格檢查解鎖狀態
        function checkUnlockStatus() {
            fetch(`${GAS_URL}?action=checkLockStatus&_t=${Date.now()}`)
                .then(res => {
                    if (!res.ok) throw new Error('HTTP 錯誤');
                    return res.json();
                })
                .then(data => {
                    // 只要後端回傳 status 為 success 且 locked明確等於 false，立即自動跳轉回首頁！
                    if (data && data.status === "success" && data.locked === false) {
                        window.location.href = 'index.html';
                    }
                })
                .catch(err => console.debug('背景解除鎖定檢測中...', err));
        }

        // 頁面載入時執行，每 3 秒輪詢一次，當試算表改回 false 時自動解鎖跳轉
        window.onload = function() {
            checkUnlockStatus();
            setInterval(checkUnlockStatus, 3000);
        };
    </script>
</body>
</html>
